<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mortex Studio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ================= HOME ================= -->

<section id="home" class="page active">

    <div class="fire-bg">

        <div class="particles"></div>

    </div>

    <div class="home-content">

        <h1 class="logo">

            Mortex Studio

        </h1>

        <p class="subtitle">

            IA especializada em Jujutsu Shenanigans

        </p>

    </div>

    <button id="startButton" onclick="abrirChat()">

        INÍCIO

    </button>

</section>

<!-- ================= CHAT ================= -->

<section id="chat" class="page">

<header>

<div class="profile">

<div class="avatar">

🔥

</div>

<div>

<h2>Mortex AI</h2>

<p>Online</p>

</div>

</div>

<button id="backButton" onclick="voltarHome()">

Voltar

</button>

</header>

<main id="messages">

<div class="ai-message">

<div class="avatar-mini">

🔥

</div>

<div class="bubble ai">

Olá!

Sou a Mortex AI.

Pergunte qualquer coisa sobre
Jujutsu Shenanigans.

</div>

</div>

</main>

<footer>

<label class="upload">

📎

<input type="file" hidden>

</label>

<input
type="text"
id="userInput"
placeholder="Digite sua pergunta..."
>

<button id="sendButton">

➤

</button>

</footer>

</section>

<script src="script.js"></script>

</body>

</html>
