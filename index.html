<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mortex Studio</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  overflow: hidden;
}

/* 🔵 CANVAS DAS FAÍSCAS */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ===== HOME ===== */
#home {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

#home h1 {
  font-size: 40px;
}

#home button {
  padding: 15px 25px;
  font-size: 18px;
  background: #2d7dff;
  border: none;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

/* ===== CHAT ===== */
#chatPage {
  position: relative;
  z-index: 2;
  display: none;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 15px;
  background: rgba(26,26,26,0.8);
  text-align: center;
  backdrop-filter: blur(5px);
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  max-width: 70%;
}

.user {
  background: #2d7dff;
  margin-left: auto;
}

.bot {
  background: #333;
}

#inputArea {
  display: flex;
  padding: 10px;
  background: rgba(26,26,26,0.8);
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
}

button.send {
  margin-left: 10px;
  padding: 10px;
  background: #2d7dff;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 🔵 FAÍSCAS -->
<canvas id="bg"></canvas>

<!-- HOME -->
<div id="home">
  <h1>Mortex Studio</h1>
  <button onclick="start()">Iniciar Chat</button>
</div>

<!-- CHAT -->
<div id="chatPage">
  <header>Mortex AI 💬</header>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="input" placeholder="Digite..." />
    <button class="send" onclick="send()">Enviar</button>
  </div>
</div>

<script>
/* ================= FAÍSCAS AZUIS ================= */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    dx: (Math.random() - 0.5) * 1,
    dy: (Math.random() - 0.5) * 1
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#2d7dff";

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
  });

  requestAnimationFrame(draw);
}

draw();

/* ================= CHAT ================= */
function start() {
  document.getElementById("home").style.display = "none";
  document.getElementById("chatPage").style.display = "flex";
}

function add(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  add(text, "user");
  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();
  add(data.reply, "bot");
}
</script>

</body>
</html>
