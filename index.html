<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mortex Studio</title>

<style>
/* ===== FUNDO ANIMADO ===== */
body {
  margin: 0;
  font-family: Arial;
  overflow: hidden;
  color: white;
  background: #000;
  animation: bgPulse 6s infinite alternate;
}

@keyframes bgPulse {
  0% { background: #000814; }
  50% { background: #001d3d; }
  100% { background: #000000; }
}

/* CANVAS FAÍSCAS */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ===== HOME ===== */
#home {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

#home h1 {
  font-size: 45px;
  text-shadow: 0 0 20px #2d7dff;
}

/* 🔵 BOTÃO ULTRA */
#home button {
  padding: 15px 30px;
  font-size: 18px;
  color: white;
  background: transparent;
  border: 2px solid #2d7dff;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.4s;
  box-shadow: 0 0 10px #2d7dff;
  animation: borderGlow 3s infinite alternate;
}

#home button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 25px #2d7dff;
}

/* borda viva */
@keyframes borderGlow {
  0% {
    border-color: #2d7dff;
    box-shadow: 0 0 10px #2d7dff;
  }
  100% {
    border-color: #000;
    box-shadow: 0 0 25px #2d7dff;
  }
}

/* ===== CHAT ===== */
#chatPage {
  position: relative;
  z-index: 2;
  display: none;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 15px;
  background: rgba(0,0,0,0.6);
  text-align: center;
  backdrop-filter: blur(5px);
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  max-width: 70%;
}

.user {
  background: #2d7dff;
  margin-left: auto;
}

.bot {
  background: #333;
}

#inputArea {
  display: flex;
  padding: 10px;
  background: rgba(0,0,0,0.6);
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
}

button.send {
  margin-left: 10px;
  padding: 10px;
  background: #2d7dff;
  border: none;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 🔵 FAÍSCAS -->
<canvas id="bg"></canvas>

<!-- HOME -->
<div id="home">
  <h1>Mortex Studio</h1>
  <button onclick="start()">Iniciar Chat</button>
</div>

<!-- CHAT -->
<div id="chatPage">
  <header>Mortex AI 💬</header>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="input" placeholder="Digite..." />
    <button class="send" onclick="send()">Enviar</button>
  </div>
</div>

<script>
/* ===== FUNDO COM FAÍSCAS AZUIS ===== */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 100; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 1,
    vy: (Math.random() - 0.5) * 1,
    r: Math.random() * 2
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#2d7dff";

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
  });

  requestAnimationFrame(animate);
}

animate();

/* ===== CHAT ===== */
function start() {
  document.getElementById("home").style.display = "none";
  document.getElementById("chatPage").style.display = "flex";
}

function add(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  add(text, "user");
  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();
  add(data.reply, "bot");
}
</script>

</body>
</html>
